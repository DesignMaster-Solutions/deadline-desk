modules:
  rovo:mcp:
    - key: deadline-desk-mcp
      name: Deadline Desk
      tools:
        - compute-deadline
        - audit-deadlines
  action:
    - key: compute-deadline
      name: Compute a Brazilian court deadline
      function: computeDeadlineFn
      actionVerb: GET
      description: >
        Computes a Brazilian civil procedure due date (CPC/2015): business days,
        national holidays, Dec 20-Jan 20 recess and DJe publication. Returns the
        due date and each skipped day with its legal reason.
      inputs:
        startDate:
          title: Intimation date
          type: string
          required: true
          description: Intimation date, or DJe availability date when djeAvailability is
            true. YYYY-MM-DD.
        days:
          title: Business days
          type: integer
          required: true
          description: Term in business days, for example 15.
        djeAvailability:
          title: Date is DJe availability
          type: boolean
          required: false
          description: True when startDate is the day the act was made available in the
            electronic gazette.
        doubled:
          title: Doubled term
          type: boolean
          required: false
          description: True for Fazenda Pública, Defensoria or co-parties with different
            lawyers (arts. 180, 183, 186, 229).
    - key: audit-deadlines
      name: Audit deadlines in a Jira project
      function: auditDeadlinesFn
      actionVerb: GET
      description: >
        Compares the due date of Jira issues labeled prazo<N> and
        intimacao-YYYY-MM-DD with the legal due date and flags late, missing,
        overdue and incomplete deadlines by issue key.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key, for example LEG.
  function:
    - key: computeDeadlineFn
      handler: index.computeDeadlineAction
    - key: auditDeadlinesFn
      handler: index.auditDeadlines
app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/70055465-241f-4a2a-ac0d-dd864dea7178
permissions:
  scopes:
    - read:jira-work
